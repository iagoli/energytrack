services:
  postgres:
    image: postgres:16-alpine
    container_name: energytrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: energytrack
      POSTGRES_PASSWORD: energytrack
      POSTGRES_DB: energytrack
    ports:
      - "5432:5432"
    volumes:
      - energytrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energytrack -d energytrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Job one-shot: aplica migrations e sai. As demais services esperam terminar.
  migrate:
    build: .
    container_name: energytrack-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://energytrack:energytrack@postgres:5432/energytrack
    volumes:
      - .:/app
      - /app/node_modules
    command: node server/db/migrate.js
    restart: "no"

  api:
    build: .
    container_name: energytrack-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3001
      DATABASE_URL: postgres://energytrack:energytrack@postgres:5432/energytrack
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao-com-no-minimo-32-bytes-aleatorios-0123456789abcdef}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ANEEL_RESOURCE_ID: ${ANEEL_RESOURCE_ID:-fcf2906c-7c32-4b9b-a637-054e7a5234f4}
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    command: node server/index.js
    restart: unless-stopped

  web:
    build: .
    container_name: energytrack-web
    depends_on:
      - api
    environment:
      VITE_API_TARGET: http://api:3001
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      # Habilita polling para HMR no caso de file events não propagarem
      # (comum em macOS/Windows). Inofensivo em Linux.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npx vite --host 0.0.0.0
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: energytrack-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha

volumes:
  energytrack_pgdata:
